name: Windows EXE release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Verify release version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            $version = python scripts/verify_release_tag.py "${{ github.ref_name }}"
          } else {
            $version = python scripts/verify_release_tag.py
          }
          if ($LASTEXITCODE -ne 0) {
            throw "release version verification failed"
          }
          "MDRL_VERSION=$version" >> $env:GITHUB_ENV
      - name: Install build dependencies
        run: python -m pip install -e ".[build,dev]"
      - name: Lint
        run: python -m ruff check src tests scripts
      - name: Test
        run: python -W error::ResourceWarning -m unittest discover -s tests
      - name: Build Windows EXE
        env:
          MDRL_YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.MDRL_YOUTUBE_OAUTH_CLIENT_ID }}
        run: python scripts/build_windows_exe.py --require-youtube-oauth-client
      - name: Smoke test Windows EXEs
        shell: pwsh
        run: |
          ./scripts/smoke_windows_exe.ps1 `
            -ExePath ./dist/master-duel-recorder-lite.exe `
            -ExpectedVersion $env:MDRL_VERSION
          ./scripts/smoke_windows_gui.ps1 `
            -ExePath ./dist/master-duel-recorder-lite-gui.exe `
            -ExpectedVersion $env:MDRL_VERSION
      - name: Create SHA-256 files
        shell: pwsh
        run: |
          foreach ($name in @("master-duel-recorder-lite.exe", "master-duel-recorder-lite-gui.exe")) {
            $path = "dist/$name"
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant()
            [System.IO.File]::WriteAllText(
              "$path.sha256",
              "$hash  $name`n",
              [System.Text.Encoding]::ASCII
            )
          }
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/master-duel-recorder-lite.exe
            dist/master-duel-recorder-lite-gui.exe
      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: master-duel-recorder-lite-windows
          path: |
            dist/master-duel-recorder-lite.exe
            dist/master-duel-recorder-lite.exe.sha256
            dist/master-duel-recorder-lite-gui.exe
            dist/master-duel-recorder-lite-gui.exe.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "docs/releases/$env:MDRL_VERSION.md"
          if (-not (Test-Path -LiteralPath $notes)) {
            throw "release notes not found: $notes"
          }
          gh release create "${{ github.ref_name }}" `
            "dist/master-duel-recorder-lite.exe" `
            "dist/master-duel-recorder-lite.exe.sha256" `
            "dist/master-duel-recorder-lite-gui.exe" `
            "dist/master-duel-recorder-lite-gui.exe.sha256" `
            --verify-tag `
            --title "master-duel-recorder-lite ${{ github.ref_name }}" `
            --notes-file $notes
      - name: Verify published release assets
        if: github.event_name == 'push'
        run: python scripts/verify_release_assets.py "${{ github.ref_name }}"
      - name: Smoke downloaded release assets
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $download = "build/release-asset-smoke"
          New-Item -ItemType Directory -Path $download -Force | Out-Null
          gh release download "${{ github.ref_name }}" `
            --pattern "master-duel-recorder-lite*.exe" `
            --dir $download `
            --clobber
          ./scripts/smoke_windows_exe.ps1 `
            -ExePath "$download/master-duel-recorder-lite.exe" `
            -ExpectedVersion $env:MDRL_VERSION
          ./scripts/smoke_windows_gui.ps1 `
            -ExePath "$download/master-duel-recorder-lite-gui.exe" `
            -ExpectedVersion $env:MDRL_VERSION
